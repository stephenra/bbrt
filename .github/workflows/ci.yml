name: CI

on:
  push:
    branches: [master, pytorch-port]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check bbrt tests

      - name: Ruff format check
        run: uv run ruff format --check bbrt tests

      - name: Type check
        run: uv run mypy bbrt

      - name: Tests
        run: uv run pytest
