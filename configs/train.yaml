# Training config for the BBRT Transformer seq2seq.
# Replaces the OpenNMT flags in the old train.sh.
data:
  data_dir: data/logp04        # dir with src_/tgt_ train/valid CSVs + vocab.json
  train_src: src_train.csv
  train_tgt: tgt_train.csv
  valid_src: src_valid.csv
  valid_tgt: tgt_valid.csv
  vocab_file: vocab.json
  max_len: 256
  batch_size: 64
  num_workers: 4

model:
  d_model: 512
  n_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  d_ff: 2048
  dropout: 0.1
  max_seq_len: 512
  tie_embeddings: true
  rope_theta: 10000.0

optim:
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  warmup_steps: 4000
  max_steps: 100000
  label_smoothing: 0.1
  grad_clip: 1.0
  scheduler: warmup_cosine

output_dir: output/logp04
seed: 1
precision: bf16-mixed          # use "32-true" on CPU
accelerator: auto
devices: auto
val_check_interval: 1000
log_every_n_steps: 50
save_top_k: 3
accumulate_grad_batches: 1
